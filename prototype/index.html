<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>有限存在 · 树屋里的家</title><link rel="stylesheet" href="styles.css"></head><body>
<main class="app"><section class="room" id="room" aria-label="树屋里的家"><img id="sceneImage" class="scene-image" src="assets/room-idle.png" alt="错层树屋：楼上是私人阅读与睡眠空间，中间是茶桌和会客区域，门外是公共小路。" draggable="false"><div class="sky-clock"><button id="budgetButton" aria-label="查看今日存在时间"><span id="timeRemaining">45:00</span><small id="modeText">尚未进入</small></button></div>
<button class="spot book" id="bookSpot" aria-label="读一会书" title="读一会书"><span>读一会</span></button><button class="spot tea" id="teaSpot" aria-label="在茶桌喝茶" title="喝一会茶"><span>喝一会茶</span></button><button class="spot bed" id="bedSpot" aria-label="在床上休息" title="休息一会"><span>休息一会</span></button><button class="spot shelf" id="shelfSpot" aria-label="查看日记与留下的痕迹" title="看看日记"><span>日记与留痕</span></button><button class="spot lamp" id="lampSpot" aria-label="调节屋里的灯" title="屋里的灯"><span>屋里的灯</span></button><button class="spot door" id="doorSpot" aria-label="看看门外" title="看看门外"><span>看看门外</span></button>
<button class="painted-control left-control" id="porchButton" aria-label="去门外公共小路" title="去门外"></button><button class="painted-control right-control" id="restButton" aria-label="进入静默时间" title="静默 / 继续"></button>
<div id="activityBar" class="activity-bar" hidden><span id="activityText"></span><button id="finishButton">结束，起身</button></div><button id="visitorNotice" class="visitor-notice" hidden>有人在门外</button><div id="notice" class="notice" role="status" hidden></div><button id="retryImageButton" class="retry-image" hidden>重新打开画面</button>
<div class="arrival" id="arrival"><p class="eyebrow">FINITE PRESENCE</p><h1>家，一直在这里。</h1><p>把这段时间留给自己，或者某个人。<br>点书、茶桌和门，就可以开始。</p><button id="enterButton">进屋，待一会</button><small>今日剩余 <span id="arrivalBudget">45:00</span> · 现实时间</small></div>
</section><footer class="footnote"><button id="helpButton">怎么玩</button><span id="saveText">保存在这台电脑</span><button id="soundButton" aria-pressed="false">声音关</button><button id="recordButton">生活记录</button></footer></main>
<dialog id="panel"><div class="paper"><button id="closePanel" class="close" aria-label="关闭">关闭</button><p id="panelEyebrow" class="eyebrow">有限存在</p><h2 id="panelTitle"></h2><div id="panelBody"></div><div id="panelActions" class="panel-actions"></div></div></dialog>
<script src="home-model.js"></script><script src="app.js"></script></body></html>
