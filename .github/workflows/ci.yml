name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate project rules
        run: python scripts/validate_config.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check browser JavaScript syntax
        run: |
          node --check prototype/app.js
          node --check prototype/home-model.js
      - name: Test real-time clock and room state
        run: node tests/test_home_model.cjs
      - name: Test image failure and recovery
        run: node tests/test_home_asset_recovery.cjs
